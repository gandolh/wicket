<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">How a call moves through Wicket</title>
  <desc id="d">Apps post calls to the wicket-api container with their own token. The queue runs one call at a time on Ollama Cloud; when the cloud fails, the job fails with the reason and the next ticket runs. Records keep counts and timings only. The queue page signs in to see and manage the queue, and Prometheus reads /metrics on the box's loopback.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#172b4d"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#f4f5f7"/>

  <!-- Left column: who talks to Wicket -->
  <g>
    <rect x="30" y="60" width="250" height="150" rx="10" fill="#ffffff" stroke="#dfe1e6" stroke-width="2"/>
    <text x="50" y="96" font-size="22" font-weight="700" fill="#172b4d">Apps</text>
    <text x="50" y="131" font-size="20" fill="#172b4d">just-a-bot</text>
    <text x="50" y="161" font-size="20" fill="#172b4d">ro-housing</text>
    <text x="50" y="192" font-size="20" fill="#5e6c84">a token each</text>

    <rect x="30" y="270" width="250" height="130" rx="10" fill="#ffffff" stroke="#dfe1e6" stroke-width="2"/>
    <text x="50" y="306" font-size="22" font-weight="700" fill="#172b4d">Queue page</text>
    <text x="50" y="340" font-size="20" fill="#172b4d">signed in</text>
    <text x="50" y="372" font-size="20" fill="#5e6c84">Force close, Clear</text>

    <rect x="30" y="460" width="250" height="110" rx="10" fill="#ffffff" stroke="#dfe1e6" stroke-width="2"/>
    <text x="50" y="497" font-size="22" font-weight="700" fill="#172b4d">Prometheus</text>
    <text x="50" y="531" font-size="20" fill="#5e6c84">box loopback only</text>
  </g>

  <!-- The API container -->
  <g>
    <rect x="430" y="30" width="370" height="570" rx="12" fill="#ffffff" stroke="#0c66e4" stroke-width="3"/>
    <text x="450" y="70" font-size="24" font-weight="700" fill="#0c66e4">wicket-api</text>
    <text x="450" y="99" font-size="20" fill="#5e6c84">Fastify, loopback 8808</text>

    <rect x="450" y="120" width="330" height="150" rx="8" fill="#ebecf0"/>
    <text x="470" y="156" font-size="22" font-weight="700" fill="#172b4d">Queue</text>
    <text x="470" y="189" font-size="20" fill="#172b4d">one call at a time</text>
    <text x="470" y="219" font-size="20" fill="#172b4d">tickets, now serving</text>
    <text x="470" y="249" font-size="20" fill="#5e6c84">in memory</text>

    <rect x="450" y="290" width="330" height="130" rx="8" fill="#ebecf0"/>
    <text x="470" y="326" font-size="22" font-weight="700" fill="#172b4d">Records (SQLite)</text>
    <text x="470" y="359" font-size="20" fill="#172b4d">counts and timings</text>
    <text x="470" y="389" font-size="20" fill="#5e6c84">never prompt or answer</text>

    <rect x="450" y="440" width="330" height="140" rx="8" fill="#ebecf0"/>
    <text x="470" y="476" font-size="22" font-weight="700" fill="#172b4d">Sign-in, /metrics</text>
    <text x="470" y="509" font-size="20" fill="#172b4d">local accounts or Ward</text>
    <text x="470" y="541" font-size="20" fill="#5e6c84">/metrics refused</text>
    <text x="470" y="567" font-size="20" fill="#5e6c84">through a proxy</text>
  </g>

  <!-- Right column: the model -->
  <g>
    <rect x="910" y="60" width="260" height="170" rx="10" fill="#ffffff" stroke="#dfe1e6" stroke-width="2"/>
    <text x="930" y="96" font-size="22" font-weight="700" fill="#172b4d">Ollama Cloud</text>
    <text x="930" y="130" font-size="20" fill="#172b4d">gpt-oss:120b</text>
    <text x="930" y="162" font-size="20" fill="#5e6c84">one call at a time</text>
    <text x="930" y="194" font-size="20" fill="#5e6c84">no model on the box</text>

    <rect x="910" y="290" width="260" height="156" rx="10" fill="#ffffff" stroke="#c9372c" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="930" y="326" font-size="22" font-weight="700" fill="#172b4d">If it fails</text>
    <text x="930" y="359" font-size="20" fill="#172b4d">the job ends failed,</text>
    <text x="930" y="389" font-size="20" fill="#172b4d">with the reason</text>
    <text x="930" y="425" font-size="20" fill="#5e6c84">next ticket runs</text>
  </g>

  <!-- Arrows -->
  <g stroke="#172b4d" stroke-width="2.5" fill="none">
    <line x1="282" y1="150" x2="446" y2="150" marker-end="url(#arrow)"/>
    <line x1="282" y1="335" x2="428" y2="335" marker-end="url(#arrow)"/>
    <line x1="282" y1="515" x2="446" y2="515" marker-end="url(#arrow)"/>
    <line x1="782" y1="160" x2="906" y2="140" marker-end="url(#arrow)"/>
    <line x1="1040" y1="232" x2="1040" y2="286" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
  </g>
  <g font-size="20" fill="#172b4d">
    <text x="300" y="138">/v1/jobs</text>
    <text x="300" y="323">/v1/queue</text>
    <text x="300" y="503">/metrics</text>
    <text x="855" y="124" text-anchor="middle">/api/chat</text>
  </g>
</svg>
