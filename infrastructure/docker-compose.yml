# Wicket: the API and its backup Ollama. Build context is the repo root (..)
# because the API's image needs the root lockfile and every workspace manifest.
#
#   docker compose -f infrastructure/docker-compose.yml up -d
#   docker compose -f infrastructure/docker-compose.yml exec wicket-ollama ollama pull gemma3:1b   # once
#
# `.env` in THIS directory is written by the deploy (0600) and is read twice:
# compose interpolates ${...} below from it, and wicket-api declares it as
# env_file so the same values reach the process. For a local run,
# `touch infrastructure/.env` is enough. It is git-ignored because it carries
# OLLAMA_API_KEY, WICKET_APP_TOKENS and the Ward client key.
services:
  wicket-api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
      target: prod
    image: wicket-api:1.0
    ports:
      # LOOPBACK ONLY. Without the 127.0.0.1 prefix this would be published on
      # every interface, reachable over plain HTTP past Caddy and its TLS, and
      # /metrics with it. The server's HOST is 0.0.0.0 because that is inside
      # the container's network namespace; this line decides who can reach it.
      - "127.0.0.1:${WICKET_PORT:-8808}:${WICKET_PORT:-8808}"
    env_file:
      - .env
    # These beat env_file. A dev .env copied here (HOST=127.0.0.1, a local
    # WICKET_DB or backup URL) would otherwise leave the server unreachable or
    # asking the wrong Ollama. The API reaches the backup by its service name:
    # under the rootless daemon a container can't reach the host's loopback.
    environment:
      HOST: 0.0.0.0
      PORT: "${WICKET_PORT:-8808}"
      WICKET_DB: /data/wicket.sqlite
      WICKET_BACKUP_URL: http://wicket-ollama:11434
    volumes:
      # The records and the accounts. Bind-mounted from the host so they
      # survive deploys and "back up Wicket" means one path. Defaults to a
      # local dir so a dev `compose up` works.
      - ${WICKET_DATA_DIR:-../data}:/data
    # Started after the backup, but not waiting on its health: Wicket runs
    # (cloud only) while the backup is down or still pulling its model.
    depends_on:
      - wicket-ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- \"http://127.0.0.1:${WICKET_PORT:-8808}/v1/health\""]
      interval: 30s
      timeout: 3s
      start_period: 10s

  # The backup model, asked only when Ollama Cloud fails. Small and capped: the
  # box is shared, and the model leaves memory a minute after its last call.
  wicket-ollama:
    image: ollama/ollama:0.24.0
    ports:
      # Loopback only, for the owner's checks on the box; Wicket itself uses
      # the compose network. WICKET_OLLAMA_PORT moves it where 11434 is taken.
      - "127.0.0.1:${WICKET_OLLAMA_PORT:-11434}:11434"
    environment:
      OLLAMA_KEEP_ALIVE: 1m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      # The pulled model (gemma3:1b, about 0.8 GB). Re-downloadable, so a named
      # volume rather than a backed-up bind mount.
      - ollama-models:/root/.ollama
    # About 1.3 GB and one core: gemma3:1b fits with a modest context.
    mem_limit: 1300m
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      start_period: 10s

volumes:
  ollama-models:
