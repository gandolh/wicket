# Wicket: the API. Build context is the repo root (..) because the image needs
# the root lockfile and every workspace manifest.
#
#   docker compose -f infrastructure/docker-compose.yml up -d
#
# `.env` in THIS directory is written by the deploy (0600) and is read twice:
# compose interpolates ${...} below from it, and wicket-api declares it as
# env_file so the same values reach the process. For a local run,
# `touch infrastructure/.env` is enough. It is git-ignored because it carries
# OLLAMA_API_KEY, WICKET_APP_TOKENS and the Ward client key.
#
# There is no model on the box: every call goes to Ollama Cloud.
services:
  wicket-api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
      target: prod
    image: wicket-api:1.0
    ports:
      # LOOPBACK ONLY. Without the 127.0.0.1 prefix this would be published on
      # every interface, reachable over plain HTTP past Caddy and its TLS, and
      # /metrics with it. The server's HOST is 0.0.0.0 because that is inside
      # the container's network namespace; this line decides who can reach it.
      - "127.0.0.1:${WICKET_PORT:-8808}:${WICKET_PORT:-8808}"
    env_file:
      - .env
    # These beat env_file. A dev .env copied here (HOST=127.0.0.1, a local
    # WICKET_DB) would otherwise leave the server unreachable or writing
    # somewhere the volume isn't.
    environment:
      HOST: 0.0.0.0
      PORT: "${WICKET_PORT:-8808}"
      WICKET_DB: /data/wicket.sqlite
    volumes:
      # The records and the accounts. Bind-mounted from the host so they
      # survive deploys and "back up Wicket" means one path. Defaults to a
      # local dir so a dev `compose up` works.
      - ${WICKET_DATA_DIR:-../data}:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- \"http://127.0.0.1:${WICKET_PORT:-8808}/v1/health\""]
      interval: 30s
      timeout: 3s
      start_period: 10s
