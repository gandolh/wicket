# A local check of the API's container, laid over docker-compose.yml: the
# data sits in a volume that `down -v` removes, instead of the repo's data/.
#
#   docker compose -p wicket-smoke -f infrastructure/docker-compose.yml \
#     -f infrastructure/docker-compose.local.yml up --build -d
#   docker compose -p wicket-smoke -f infrastructure/docker-compose.yml \
#     -f infrastructure/docker-compose.local.yml down -v
#
# infrastructure/.env sets WICKET_APP_TOKENS. docs/owner-setup.md has the
# whole check.
services:
  wicket-api:
    volumes:
      # Replaces the bind mount (same target), so the check leaves no files
      # behind and never touches the repo's data/.
      - wicket-data:/data

volumes:
  wicket-data:
